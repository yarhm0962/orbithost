<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>modal test</title><link rel="stylesheet" href="/styles.css?v=6"><link rel="stylesheet" href="/ui-polish.css?v=9"></head><body>
<div class="modal-backdrop" data-dismiss="modal"><section class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><div class="modal-title" id="modal-title">New project</div><div class="modal-subtitle">Up to 5 bots per project. Up to 3 projects total.</div></div><button class="icon-button" data-action="close-modal" aria-label="Close dialog">✕</button></div><form data-form="create-project" id="create-project-form"><div class="modal-body"><div class="field"><label class="field-label" for="new-project-name">Project name</label><input id="new-project-name" class="field-input" name="name" maxlength="60" placeholder="my-bots"><div class="field-hint">Use letters, numbers, spaces, dots, underscores, and hyphens. Add bots after the project is created.</div></div><div class="field" style="margin-top:17px"><span class="field-label">Filler field A</span><input class="field-input" placeholder="filler a"></div><div class="field" style="margin-top:17px"><span class="field-label">Filler field B</span><input class="field-input" placeholder="filler b"></div><div class="field" style="margin-top:17px"><span class="field-label">Filler field C</span><input class="field-input" placeholder="filler c"></div></div><div class="modal-footer"><button type="button" class="button button-quiet" data-action="close-modal">Cancel</button><button type="submit" class="button button-primary" id="create-project-submit">Create project</button></div></form></section></div>
</body></html>
